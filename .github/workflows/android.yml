name: Android

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate or install Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] && [ -d /usr/local/lib/android/sdk ]; then
            SDK=/usr/local/lib/android/sdk
          fi
          if [ -z "$SDK" ]; then
            SDK="$HOME/android-sdk"
          fi
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Install SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug testDebugUnitTest --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cn-tvlauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="cn-tvlauncher-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"
          notes=$(cat <<EOF
          ## 清爽桌面 ${GITHUB_REF_NAME}

          调试版 APK，可用 U 盘或 \`adb install -r\` 安装。安装说明见仓库 README。

          去广告会通过本机 ADB 执行 \`pm disable-user\` 停用系统包（不卸载）。该操作由使用者自行承担风险，且未在真实设备上测试。还原请用应用内「恢复原厂桌面」，或 \`adb shell pm enable <包名>\`。

          \`Adb.java\` 改编自 https://github.com/simbasjungles/free-my-tv （MIT）。
          EOF
          )
          gh release create "$GITHUB_REF_NAME" "$asset" \
            --title "清爽桌面 ${GITHUB_REF_NAME}" \
            --notes "$notes"
